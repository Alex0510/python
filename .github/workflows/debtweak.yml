name: Build Tweak

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        cd $HOME/theos && git checkout master
        
    - name: Setup ld64
      run: |
        sudo apt-get update
        sudo apt-get install -y lld
        
    - name: Build package
      env:
        THEOS: $HOME/theos
        TARGET: iphone:clang:latest
        ARCHS: arm64
        LD: /usr/bin/ld.lld
        LDFLAGS: -fuse-ld=lld
      run: |
        make clean || true
        make package
        mkdir -p output
        find . -name "*.deb" -exec mv {} output/ \;
        
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: deb-package
        path: output/*.deb